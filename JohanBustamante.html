<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulario de Registro</title>
  <link rel="stylesheet" href="JohanBustamante.css" />
</head>

<body>
  <header>
    <h1>Formulario de Registro</h1>
    <p>Completa los campos para crear tu cuenta</p>
  </header>

  <main>
    <form action="#" method="post">
      <!-- Nombre -->
      <div class="form-grupal">
        <label for="nombre">Nombre completo:</label>
        <input type="text" placeholder="Ej. Johan Bustamante" required />
      </div>

      <!-- Email -->
      <div class="form-grupal">
        <label for="email">Correo electrónico:</label>
        <input type="email" placeholder="Ej. ejemplo@mail.com" required />
      </div>

      <!-- Contraseña -->
      <div class="form-grupal">
        <label for="password">Contraseña:</label>
        <input type="password" required />
      </div>

      <!-- Fecha de nacimiento -->
      <div class="form-grupal">
        <label for="fecha">Fecha de nacimiento:</label>
        <input type="date" required />
      </div>

      <fieldset class="form-grupal">
        <legend>Tipo de documento: </legend>
        <label><input type="radio" name="Tipo" value="C.C" required /> C.C</label>
        <label><input type="radio" name="Tipo" value="T.I" /> T.I</label>
        <label><input type="radio" name="Tipo" value="C.E" /> C.E</label>
      </fieldset>


       <!-- Numero de identificacion -->
       <div class="form-grupal">
        <label for="Numero">Numero de identificacion: </label>
        <input type="number" required />
      </div>

      <!-- Género (Radio buttons) -->
      <fieldset class="form-grupal">
        <legend>Género:</legend>
        <label><input type="radio" name="genero" value="masculino" required /> Masculino</label>
        <label><input type="radio" name="genero" value="femenino" /> Femenino</label>
        <label><input type="radio" name="genero" value="otro" /> Otro</label>
      </fieldset>

      <!-- Aceptar términos -->
      <div class="form-grupal checkbox">
        <label>
          <input type="checkbox" name="terminos" required />
          Acepto los términos y condiciones
        </label>
      </div>

      <button type="submit">Registrarse</button>
    </form>
  </main>

  <footer>
    <small>Gracias Por Su Colaboracion</small>
  </footer>
</body>
</html>
